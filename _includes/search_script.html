<script type="text/javascript">
(function () {
    var container = document.getElementById('entry-list');
    var input = container ? container.querySelector('.search') : null;
    if (!input || typeof entryList === 'undefined') {
        return;
    }


    // Same terms as List.js: quoted phrases, then words.
    var terms = function (value) {
        var result = [];
        var string = value.toLowerCase().replace(/"([^"]+)"/g, function (all, phrase) {
            result.push(phrase);
            return ' ';
        });
        return result.concat(string.trim().split(/\s+/)).filter(Boolean);
    };

    var escape = function (string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    };

    // List.js escapes some characters of the search string ("-", ".", ",",
    // "+"…) and searches the escaped string, so "omeka-s" or "3.4" are never
    // found. So the search uses the string as typed.
    var valueColumns = entryList.valueNames.filter(function (name) {
        return typeof name === 'string' && name.indexOf('addon-stat-') !== 0;
    });
    var search = function () {
        var words = terms(input.value);
        if (!words.length) {
            entryList.search();
            return;
        }
        entryList.search(input.value, function () {
            entryList.items.forEach(function (item) {
                var values = item.values();
                item.found = words.every(function (word) {
                    return valueColumns.some(function (column) {
                        var value = values[column];
                        return value !== undefined && value !== null
                            && String(value).toLowerCase().indexOf(word) !== -1;
                    });
                });
            });
        });
    };
    input.addEventListener('input', search);

    // Highlight in the searchable columns only, not in the hidden values.
    var columns = valueColumns.map(function (name) { return '.' + name; }).join(',');

    var highlighted = [];
    var clear = function () {
        highlighted.forEach(function (mark) {
            var parent = mark.parentNode;
            if (parent) {
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
                parent.normalize();
            }
        });
        highlighted = [];
    };

    var highlight = function () {
        clear();
        var words = terms(input.value);
        if (!words.length) {
            return;
        }
        var regex = new RegExp('(' + words.map(escape).join('|') + ')', 'gi');
        entryList.visibleItems.forEach(function (item) {
            item.elm.querySelectorAll(columns).forEach(function (cell) {
                var walker = document.createTreeWalker(cell, NodeFilter.SHOW_TEXT);
                var nodes = [];
                while (walker.nextNode()) {
                    nodes.push(walker.currentNode);
                }
                nodes.forEach(function (node) {
                    var text = node.nodeValue;
                    regex.lastIndex = 0;
                    if (!regex.test(text)) {
                        return;
                    }
                    var fragment = document.createDocumentFragment();
                    text.split(regex).forEach(function (part, index) {
                        if (index % 2) {
                            var mark = document.createElement('mark');
                            mark.className = 'search-highlight';
                            mark.textContent = part;
                            fragment.appendChild(mark);
                            highlighted.push(mark);
                        } else if (part) {
                            fragment.appendChild(document.createTextNode(part));
                        }
                    });
                    node.parentNode.replaceChild(fragment, node);
                });
            });
        });
    };

    entryList.on('updated', highlight);
})();
</script>
